name: FAST
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-selftest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build product
        run: dotnet build src/RekordboxMyTagSync/RekordboxMyTagSync.csproj -c Release
      - name: Run deterministic mapping self-tests
        run: dotnet run --project tests/RekordboxMyTagSync.SelfTests/RekordboxMyTagSync.SelfTests.csproj -c Release
