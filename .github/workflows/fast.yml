name: FAST
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-selftest:
    runs-on: windows-latest
    env:
      PRODUCT_PROJECT: src/RekordboxMyTagSync/RekordboxMyTagSync.csproj
      TEST_PROJECT: tests/RekordboxMyTagSync.SelfTests/RekordboxMyTagSync.SelfTests.csproj
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact-SHA FAST dispatcher regression without GitHub requests
        run: python tests/test_recover_main_fast.py
      - name: Verify Windows 11 candidate ZIP preflight with synthetic tampering
        shell: pwsh
        run: '& ./scripts/Verify-Win11Candidate.ps1 -SelfTest'
      - name: Verify real .NET single-file manifest audit rejects synthetic attacks
        shell: pwsh
        run: python scripts/audit-single-file-bundle.py --self-test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - name: Verify patched .NET SDK/WindowsDesktop security runtime
        shell: pwsh
        run: |
          & ./scripts/Assert-PatchedDotNet.ps1 -SelfTest
          & ./scripts/Assert-PatchedDotNet.ps1
      - name: Assert FULL artifact and public release gates stay closed
        shell: pwsh
        run: python scripts/verify-public-artifact-hold.py
      - name: Restore locked dependency graph
        shell: pwsh
        run: |
          dotnet restore $env:PRODUCT_PROJECT -r win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Product locked restore failed." }
          dotnet restore $env:TEST_PROJECT -r win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Self-test locked restore failed." }
      - name: Build product
        run: dotnet build $env:PRODUCT_PROJECT -c Release --no-restore
      - name: Run deterministic mapping self-tests
        run: dotnet run --project $env:TEST_PROJECT -c Release --no-restore
      # Read public Bridge source at one previously Win32/x64-qualified
      # immutable SHA. Checkout into the disposable runner workspace only.
      # No component, production profile, user music or artifact is uploaded.
      - name: Checkout pinned original native foobar Bridge Publisher test sources
        uses: actions/checkout@v4
        with:
          repository: lxsdd/foo_dj_library_bridge
          ref: badc4a9594f8016823dfd6c83a9741307547a345
          path: native-bridge-publisher
          persist-credentials: false
      - name: Original native Bridge Publisher -> MyTagSync encrypted Preview E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Use the Visual Studio installation supplied by windows-latest.
          # Do not add a third-party setup action to this cross-repo integration gate.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\\Installer\\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Visual Studio vswhere.exe is not present on runner.' }
          $msbuildCandidates = @(& $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\\**\\Bin\\MSBuild.exe')
          $msbuild = $msbuildCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $msbuild) { throw 'No preinstalled Visual Studio MSBuild.exe found via vswhere.' }
          & $msbuild 'native-bridge-publisher/tests/publisher_integration.vcxproj' /m /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /restore
          if ($LASTEXITCODE -ne 0) { throw 'Pinned original native Bridge Publisher fixture build failed.' }
          $exe = Join-Path $env:GITHUB_WORKSPACE 'native-bridge-publisher/out/x64/Release/publisher_integration.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Original Publisher integration executable missing.' }
          $rootBase = Join-Path $env:RUNNER_TEMP ('mytagsync-native-publisher-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $attemptRoots = @($rootBase, ($rootBase + '-retry1'))
          foreach ($candidateRoot in $attemptRoots) {
            if (Test-Path -LiteralPath $candidateRoot) { throw 'Refusing to reuse a native Publisher fixture directory.' }
          }
          try {
            $completedRoot = $null
            for ($attempt = 0; $attempt -lt 2; $attempt++) {
              $root = $attemptRoots[$attempt]
              $output = (& $exe $root 2>&1 | Out-String)
              $exitCode = $LASTEXITCODE
              Write-Host $output
              if ($exitCode -eq 0) {
                $completedRoot = $root
                break
              }
              # Do not suppress structural C++ Publisher failures. Retry once,
              # in a *fresh* synthetic root, only for the previously observed
              # completed-generation-zero timeout (never an arbitrary failure).
              if ($attempt -ne 0 -or
                  -not $output.Contains('PUBLISHER_NATIVE_INTEGRATION=FAIL Timed out at generation 7 marker=7:0 items=0')) {
                throw "Native Publisher failed; attempt=$attempt exit=$exitCode."
              }
              Write-Warning 'Observed known generation-7/complete=0 timeout. One isolated diagnostic retry; never considered PASS by itself.'
            }
            if (-not $completedRoot) { throw 'Native Publisher never passed the complete integration fixture.' }
            dotnet run --project $env:TEST_PROJECT -c Release --no-restore -- --native-bridge-publisher-root $completedRoot
            if ($LASTEXITCODE -ne 0) { throw 'Native Bridge -> real SQLCipher Preview integration failed.' }
          } finally {
            foreach ($root in $attemptRoots) {
              if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
            }
          }
      - name: PR-only published .NET 10 single-file + sidecar inventory
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishRoot = Join-Path $env:RUNNER_TEMP 'mytagsync-actual-bundle-pr'
          if (Test-Path -LiteralPath $publishRoot) { throw 'Refusing to reuse publish directory.' }
          try {
            dotnet publish $env:PRODUCT_PROJECT -c Release -r win-x64 --self-contained true --no-restore -p:RuntimeFrameworkVersion=10.0.13 -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -o $publishRoot
            if ($LASTEXITCODE -ne 0) { throw 'PR-only actual Windows publish failed.' }
            python scripts/audit-single-file-bundle.py --exe (Join-Path $publishRoot 'rekordbox MyTagSync.exe') --publish-dir $publishRoot --output (Join-Path $env:RUNNER_TEMP 'mytagsync-bundle-pr.json')
            if ($LASTEXITCODE -ne 0) { throw 'PR-only actual Windows embedded + sidecar inventory failed.' }
          } finally {
            if (Test-Path -LiteralPath $publishRoot) { Remove-Item -LiteralPath $publishRoot -Recurse -Force }
          }
      - name: Smoke-test WPF startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "src/RekordboxMyTagSync/bin/Release/net10.0-windows/win-x64/rekordbox MyTagSync.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "WPF product executable is missing after build."
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--ui-smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            $errorPath = Join-Path ([System.IO.Path]::GetTempPath()) "RekordboxMyTagSync-ui-smoke-error.txt"
            if (Test-Path -LiteralPath $errorPath -PathType Leaf) {
              Write-Host "WPF UI SMOKE EXCEPTION:"
              Get-Content -LiteralPath $errorPath
              Remove-Item -LiteralPath $errorPath -Force
            }
            throw "WPF UI smoke test failed with exit code $($process.ExitCode)."
          }
